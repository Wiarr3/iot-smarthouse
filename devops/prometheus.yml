global:
  scrape_interval: 10s

scrape_configs:
  - job_name: 'iot-server'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['iot-server:8081']

  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka:9092']

  - job_name: 'kafka-ui'
    static_configs:
      - targets: ['kafka-ui:8080']

  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
