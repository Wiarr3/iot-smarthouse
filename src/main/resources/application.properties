spring.application.name=server
server.port=8081
spring.profiles.active=simulator


spring.kafka.bootstrap-servers=kafka:9092

spring.kafka.consumer.group-id=iot-consumer-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.admin.auto-create=true


spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your_email@gmail.com
spring.mail.password=your_app_password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

notifier.email.enabled=true
notifier.log.enabled=true

alert.mail.to=recipient@example.com


management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.access=unrestricted
management.prometheus.metrics.export.enabled=true

management.endpoint.health.show-details=always
management.endpoints.access.default=unrestricted

server.address=0.0.0.0


auth0.audience=https://smarthouse2.eu.auth0.com/api/v2/
auth0.issuer=https://smarthouse2.eu.auth0.com/


spring.security.oauth2.resourceserver.jwt.issuer-uri=${auth0.issuer}
spring.security.oauth2.resourceserver.jwt.audiences=${auth0.audience}


spring.datasource.url=jdbc:postgresql://postgres:5432/smarthouse
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
